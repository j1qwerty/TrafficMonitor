name: Release CI

on:
  push:
    branches:
      - master
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build_x64:
    name: Build Lite x64
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[release]'))
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Ensure MFC is installed
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $installer)) {
            throw "Visual Studio Installer not found: $installer"
          }

          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) {
            throw "Visual Studio installation not found."
          }

          Write-Host "Using Visual Studio at $installPath"

          & $installer modify --installPath "$installPath" --add Microsoft.VisualStudio.Component.VC.MFC --quiet --norestart --wait

          if ($LASTEXITCODE -ne 0) {
            throw "Visual Studio MFC installation failed with exit code $LASTEXITCODE"
          }

          $mfcHeader = Get-ChildItem "$installPath\VC\Tools\MSVC\*\atlmfc\include\afxwin.h" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mfcHeader) {
            throw "MFC headers were not found after installation."
          }

          Write-Host "MFC header: $($mfcHeader.FullName)"

      - name: Build Lite x64
        shell: pwsh
        run: |
          $solutionDir = "$env:GITHUB_WORKSPACE\"
          $project = "$env:GITHUB_WORKSPACE\TrafficMonitor\TrafficMonitor.vcxproj"

          msbuild $project /m /p:Configuration="Release (lite)" /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="$solutionDir"

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Verify executable
        shell: pwsh
        run: |
          $output = "$env:GITHUB_WORKSPACE\Bin\x64\Release (lite)\TrafficMonitor.exe"

          if (-not (Test-Path $output)) {
            throw "Expected executable was not produced: $output"
          }

          $file = Get-Item $output
          Write-Host "Built: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

      - name: Package x64 Lite
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE\Bin\x64\Release (lite)"
          $package = "$env:GITHUB_WORKSPACE\package"
          $zip = "$env:GITHUB_WORKSPACE\TrafficMonitor_x64_Lite.zip"
          $exe = "$env:GITHUB_WORKSPACE\TrafficMonitor_x64_Lite.exe"

          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "$source\*" "$package\" -Recurse -Force
          Compress-Archive -Path "$package\*" -DestinationPath $zip -Force
          Copy-Item "$source\TrafficMonitor.exe" $exe -Force

      - name: Upload x64 release assets
        uses: actions/upload-artifact@v7
        with:
          name: trafficmonitor-x64-lite
          path: |
            TrafficMonitor_x64_Lite.zip
            TrafficMonitor_x64_Lite.exe
          if-no-files-found: error

  release:
    name: Create v<version> release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[release]'))
    needs: build_x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(grep -oPm1 '(?<=<version>)[^<]+' version.info | tr -d '[:space:]')"

          if [ -z "$version" ]; then
            echo "Could not read <version>...</version> from version.info"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 1
          fi

      - name: Create annotated tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git fetch --tags origin

          if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            target="$(git rev-list -n 1 "$TAG")"

            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG exists but points to $target instead of $GITHUB_SHA"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "TrafficMonitor $TAG"
            git push origin "$TAG"
          fi

      - name: Download x64 assets
        uses: actions/download-artifact@v8
        with:
          name: trafficmonitor-x64-lite
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "release-assets/TrafficMonitor_x64_Lite.zip" \
            "release-assets/TrafficMonitor_x64_Lite.exe" \
            --verify-tag \
            --title "TrafficMonitor v$VERSION" \
            --notes "Lite x64 release for TrafficMonitor. Includes the taskbar-only build, the complete ZIP package, and the built executable." \
            --generate-notes
